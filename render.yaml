# Render Blueprint — the interview service
#
# Render → New → Blueprint → this repository. It reads this file and creates
# the service; the only thing it will ask you for is the Groq key.
#
# The portal itself stays on Vercel. This is the half that cannot live there:
# a long-running process that holds the voice model in memory and keeps a
# session while somebody is halfway through answering.
services:
  - type: web
    name: hiero-interview-api
    runtime: node
    rootDir: interview-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # The only one you have to supply. Copy it from the gateway's .env.
      - key: GROQ_API_KEY
        sync: false

      # Not optional. The default in the code is llama-3.3-70b-versatile,
      # which Groq has retired — it 404s, and the failure is silent: answers
      # save, questions fall back to a generic set, and the report says the
      # assessment could not be produced.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # Signs the invite tokens, which are the candidate's whole credential.
      # Render generates it; changing it later kills every outstanding link.
      - key: INTERVIEW_SECRET
        generateValue: true

      # Server-to-server callers only. Never goes near a browser.
      - key: CONNECT_API_KEY
        generateValue: true

      # Not optional. Interviews in progress live here. Without it they go
      # to a file on Render's disk, which is thrown away every time the
      # service restarts — and the free plan restarts on its own after
      # fifteen idle minutes. A candidate halfway through then gets "that
      # answer could not be saved" and cannot finish.
      #
      # Same value as the gateway's MONGODB_URI.
      - key: MONGODB_URI
        sync: false

      # Posting the finished report to whoever asked for the interview.
      # The same two values the gateway service already has -- copy them
      # from there. Render's free plan blocks SMTP, so this goes out over
      # Resend's HTTPS API; without it the interview still works and the
      # report still appears in the portal, and only the email is skipped.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: HIERO Connect <noreply@hiero.in>

      - key: HIERO_GATEWAY_URL
        value: https://hiero.in
      - key: PORTAL_URL
        value: https://connect.hiero.in
      - key: ALLOWED_ORIGINS
        value: https://connect.hiero.in
      - key: QUESTION_COUNT
        value: 8

      # Off on the free plan, and the reason is CPU rather than memory —
      # the model needs about 60MB, which fits fine.
      #
      # A free instance gets 0.1 of a CPU. Kokoro's inference runs in-process
      # and blocks Node's event loop, so generating five seconds of speech
      # pegs the whole service for around a minute. Render's health check
      # gets no answer in that time, decides the service is dead and
      # restarts it — in the middle of somebody's interview.
      #
      # So the candidate's browser reads the questions instead. Turn this
      # back on when the service is on an instance with a real CPU; the
      # portal picks the better voice up on its own, because the session
      # tells it whether the model is loaded.
      - key: VOICE_ENABLED
        value: "false"
